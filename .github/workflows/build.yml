name: Validate and build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate all workflow contexts and syntax
        run: |
          set -o pipefail
          mkdir -p /tmp/actionlint builds/qa
          curl --fail --location --retry 3 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' /tmp/actionlint.tar.gz | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          /tmp/actionlint/actionlint -version 2>&1 | tee builds/qa/actionlint-version.log
          /tmp/actionlint/actionlint -shellcheck= -pyflakes= 2>&1 | tee builds/qa/actionlint.log
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Godot and matching templates
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/export
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv /tmp/export/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - name: Import and configure Android exporter
        run: |
          set -o pipefail
          godot --headless --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/import.log; then exit 1; fi
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Signing configuration regressions
        run: python3 -m unittest discover -s tests -p 'test_preview_signing.py' -v
      - name: Automated tests and scene smoke
        run: |
          python3 tools/run_headless_checks.py
      - name: Render presentation captures
        run: |
          if ! command -v xvfb-run; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --rendering-method gl_compatibility --audio-driver Dummy -- --capture
      - name: Emit bounded CI verification preview
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          report = json.loads(Path('builds/qa/headless-results.json').read_text())
          assert report['status'] == 'passed'
          print('CI_HEADLESS_REPORT ' + json.dumps(report, separators=(',', ':')))
          for name, prefix in [('upgrade_queue', 'CI_QUEUE'), ('performance_stats', 'CI_PERF'), ('build_overview', 'CI_BUILD'), ('engineer_sentry', 'CI_ENGINEER')]:
              capture = Path('builds/screenshots/' + name + '.png').read_bytes()
              assert capture.startswith(b'\x89PNG\r\n\x1a\n')
              if len(capture) <= 262144:
                  encoded = base64.b64encode(capture).decode('ascii')
                  for start in range(0, len(encoded), 12000):
                      print(prefix + '_PREVIEW_PNG ' + encoded[start:start + 12000])
              else:
                  print(prefix + '_PREVIEW_SKIPPED bytes=' + str(len(capture)))
          PY
      - name: Export debug APK
        run: |
          mkdir -p builds/android
          python3 tools/configure_development_export.py
          godot --headless --export-debug Android builds/android/null-swarm-development-debug.apk
          test -s builds/android/null-swarm-development-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify builds/android/null-swarm-development-debug.apk
          sha256sum builds/android/null-swarm-development-debug.apk > builds/android/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: null-swarm-development-apk
          path: |
            builds/android/
            builds/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: null-swarm-headless-results
          path: builds/qa/
          retention-days: 14
          if-no-files-found: warn
