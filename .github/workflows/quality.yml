name: Repeatable gameplay QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gameplay-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and run system checks
        run: |
          set -o pipefail
          mkdir -p builds/qa
          godot --headless --editor --import --quit 2>&1 | tee builds/qa/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load' builds/qa/import.log; then exit 1; fi
          python3 tools/run_headless_checks.py
      - name: Paired spatial-query kernels
        run: |
          set -o pipefail
          timeout 120s godot --headless --script tests/run_grid_benchmark.gd 2>&1 | tee builds/qa/grid-benchmark.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/grid-benchmark.log; then exit 1; fi
          test -s builds/qa/grid-benchmark.json
      - name: Diagnostic observation gameplay parity
        run: |
          set -o pipefail
          timeout 180s godot --headless --script tests/run_playtests.gd -- --diagnostics-parity 2>&1 | tee builds/qa/diagnostics-parity.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/diagnostics-parity.log; then exit 1; fi
          test -s builds/qa/diagnostics-parity.json
      - name: Normal-rules bot playtests
        run: |
          set -o pipefail
          timeout 900s godot --headless --script tests/run_playtests.gd 2>&1 | tee builds/qa/bots.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/bots.log; then exit 1; fi
          test -s builds/qa/bot-report.json
      - name: Normal-rules corruption sessions
        run: |
          set -o pipefail
          timeout 900s godot --headless --script tests/run_playtests.gd -- --corruption-probe 2>&1 | tee builds/qa/corruption-probe.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/corruption-probe.log; then exit 1; fi
          test -s builds/qa/corruption-probe.json
      - name: Additional seeded sessions
        run: |
          set -o pipefail
          timeout 900s godot --headless --script tests/run_playtests.gd -- --extended-seeds 2>&1 | tee builds/qa/extended.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/extended.log; then exit 1; fi
          test -s builds/qa/extended-seeds.json
      - name: Normal-rules earned Engineer sessions
        run: |
          set -o pipefail
          timeout 900s godot --headless --script tests/run_playtests.gd -- --engineer-probe 2>&1 | tee builds/qa/engineer-probe.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/engineer-probe.log; then exit 1; fi
          test -s builds/qa/engineer-probe.json
      - name: UI lifecycle and window-size captures
        run: |
          set -o pipefail
          if ! command -v xvfb-run; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180s xvfb-run -a -s "-screen 0 1920x1200x24" godot --rendering-method gl_compatibility --audio-driver Dummy --script tests/run_ui_tests.gd -- --capture-ui 2>&1 | tee builds/qa/ui.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/ui.log; then exit 1; fi
          test -s builds/qa/ui-report.json
      - name: Pickup merge A/B and collector comparison
        run: |
          set -o pipefail
          timeout 900s godot --headless --script tests/run_playtests.gd -- --xp-comparison 2>&1 | tee builds/qa/xp-comparison.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/xp-comparison.log; then exit 1; fi
          test -s builds/qa/xp-comparison.json
      - name: Upgrade pacing and collector comparison
        run: |
          set -o pipefail
          timeout 900s godot --headless --script tests/run_playtests.gd -- --pacing-probe 2>&1 | tee builds/qa/pacing-probe.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/pacing-probe.log; then exit 1; fi
          test -s builds/qa/pacing-probe.json
      - name: Synthetic combat CPU benchmark
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 600s godot --headless --script tests/run_benchmark.gd 2>&1 | tee builds/qa/stress.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/stress.log; then exit 1; fi
          test -s builds/qa/stress-report.json
      - name: Corrupted-loadout CPU benchmark
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 600s godot --headless --script tests/run_benchmark.gd -- --corruption-stress 2>&1 | tee builds/qa/corruption-stress.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/corruption-stress.log; then exit 1; fi
          test -s builds/qa/corruption-stress-report.json
      - name: Singularity-field CPU benchmark
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 600s godot --headless --script tests/run_benchmark.gd -- --gravity-stress 2>&1 | tee builds/qa/gravity-stress.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/gravity-stress.log; then exit 1; fi
          test -s builds/qa/gravity-stress-report.json
      - name: Engineer sentry CPU benchmark
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 600s godot --headless --script tests/run_benchmark.gd -- --engineer-stress --phase-profile 2>&1 | tee builds/qa/engineer-stress.log
          if grep -E 'SCRIPT ERROR|ERROR:' builds/qa/engineer-stress.log; then exit 1; fi
          test -s builds/qa/engineer-stress-report.json
      - name: Publish QA summaries
        if: ${{ !cancelled() }}
        run: |
          for report in builds/qa/BOT_REPORT.md builds/qa/STRESS_REPORT.md builds/qa/XP_COMPARISON.md builds/qa/PACING_REPORT.md builds/qa/CORRUPTION_STRESS_REPORT.md builds/qa/GRAVITY_STRESS_REPORT.md builds/qa/ENGINEER_STRESS_REPORT.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: null-swarm-gameplay-qa
          retention-days: 14
          path: builds/qa/
          if-no-files-found: error
